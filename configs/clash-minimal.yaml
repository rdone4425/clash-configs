# Clash / Mihomo 精简配置：只做国内直连，不依赖外部规则集
# 示例节点使用 203.0.113.x（文档专用地址），不能直接连通，请替换成自己的订阅或节点。
# 规则集来自 MetaCubeX/meta-rules-dat，首次加载会下载 mrs 文件。
# 生成时间：2026-10-18T12:07:58.429Z

mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - +.msftconnecttest.com
    - +.msftncsi.com
    - time.*.com
    - ntp.*.com
    - +.pool.ntp.org
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
proxies:
  - name: 示例-香港
    type: ss
    server: 203.0.113.10
    port: 8388
    cipher: aes-256-gcm
    password: example-password
    udp: true
  - name: 示例-日本
    type: trojan
    server: 203.0.113.11
    port: 443
    password: example-password
    network: tcp
    sni: example.com
    udp: true
  - name: 示例-美国
    type: vmess
    server: 203.0.113.12
    port: 443
    uuid: 11111111-1111-1111-1111-111111111111
    alterId: 0
    cipher: auto
    network: ws
    ws-opts:
      path: /ray
      headers:
        Host: example.com
    tls: true
    servername: example.com
    udp: true
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - 示例-香港
      - 示例-日本
      - 示例-美国
      - DIRECT
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
      - 示例-香港
      - 示例-日本
      - 示例-美国
  - name: 🔯 故障转移
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    proxies:
      - 示例-香港
      - 示例-日本
      - 示例-美国
  - name: 🔮 负载均衡
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    strategy: round-robin
    lazy: true
    proxies:
      - 示例-香港
      - 示例-日本
      - 示例-美国
  - name: 🤖 AI 服务
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - 示例-香港
      - 示例-日本
      - 示例-美国
      - DIRECT
  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - 示例-香港
      - 示例-日本
      - 示例-美国
      - DIRECT
  - name: 📲 电报
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - 示例-香港
      - 示例-日本
      - 示例-美国
      - DIRECT
  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - 示例-香港
      - 示例-日本
      - 示例-美国
  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - 示例-香港
      - 示例-日本
      - 示例-美国
  - name: 🎮 游戏平台
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - 示例-香港
      - 示例-日本
      - 示例-美国
  - name: 🧑‍💻 开发服务
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - 示例-香港
      - 示例-日本
      - 示例-美国
      - DIRECT
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT
rules:
  - DOMAIN-SUFFIX,local,🎯 全球直连
  - DOMAIN,localhost,🎯 全球直连
  - DOMAIN-SUFFIX,lan,🎯 全球直连
  - DOMAIN-SUFFIX,home.arpa,🎯 全球直连
  - IP-CIDR,127.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,10.0.0.0/8,🎯 全球直连,no-resolve
  - IP-CIDR,172.16.0.0/12,🎯 全球直连,no-resolve
  - IP-CIDR,192.168.0.0/16,🎯 全球直连,no-resolve
  - IP-CIDR,100.64.0.0/10,🎯 全球直连,no-resolve
  - IP-CIDR6,::1/128,🎯 全球直连,no-resolve
  - IP-CIDR6,fc00::/7,🎯 全球直连,no-resolve
  - IP-CIDR6,fe80::/10,🎯 全球直连,no-resolve
  - GEOIP,CN,🎯 全球直连
  - MATCH,🐟 漏网之鱼
